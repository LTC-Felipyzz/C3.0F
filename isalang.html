<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isa Lang - Arthur Felip</title>
  <style>
    @import url('https://fonts.google.com/specimen/Bitcount+Prop+Single?query=Bitcount+Prop+Single&preview.script=Latn')
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #121212;
      color: #ffffff;
      font-family: Bitcount Prop Single;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      background-image: url('IMG_20260809_155622_913.jpg');
      background-size: cover;                 
      background-position: center;             
      background-repeat: no-repeat;            
      background-attachment: fixed;          
      }

    .player-card {
      background: #232529;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      border: 2px solid transparent;
      background-image: 
        linear-gradient(#232529, #232529), 
        linear-gradient(135deg, #00d2ff, #ff005c, #ff7700, #00d2ff);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      background-size: 100% 100%, 300% 300%;
      animation: lightning-glow 3s linear infinite;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
      font-family: Bitcount Prop Single;
    }

    @keyframes lightning-glow {
      0% {
        background-position: 0% 0%, 0% 50%;
        box-shadow: 
          0 0 10px #00d2ff,
          0 0 25px rgba(255, 0, 92, 0.6),
          0 0 40px rgba(255, 119, 0, 0.4);
      }
      50% {
        background-position: 0% 0%, 100% 50%;
        box-shadow: 
          0 0 15px #ff005c,
          0 0 30px rgba(255, 119, 0, 0.7),
          0 0 45px rgba(0, 210, 255, 0.5);
      }
      100% {
        background-position: 0% 0%, 0% 50%;
        box-shadow: 
          0 0 10px #00d2ff,
          0 0 25px rgba(255, 0, 92, 0.6),
          0 0 40px rgba(255, 119, 0, 0.4);
      }
    }

    .header-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 4px;
      box-sizing: border-box;
    }

    .title-group {
      text-align: center;
      flex: 1;
    }

    /* Speaker Styling */
    .speaker-icon {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.08s ease-out, filter 0.08s ease-out;
      transform-origin: center;
      filter: drop-shadow(0 0 6px rgba(255, 0, 92, 0.3));
      will-change: transform;
    }

    /* Tamed Subtle Vibration for Huge Heavy Beats Only */
    @keyframes bass-shake {
      0% { transform: scale(var(--spk-scale, 1)) translate(0, 0); }
      25% { transform: scale(var(--spk-scale, 1)) translate(-0.8px, 0.8px); }
      50% { transform: scale(var(--spk-scale, 1)) translate(0.8px, -0.8px); }
      75% { transform: scale(var(--spk-scale, 1)) translate(-0.8px, -0.8px); }
      100% { transform: scale(var(--spk-scale, 1)) translate(0, 0); }
    }

    .speaker-icon.vibrate {
      animation: bass-shake 0.07s ease-in-out infinite;
    }

    .speaker-svg {
      width: 100%;
      height: 100%;
    }

    /* Beat Visualizer Bars */
    .beat-line {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 5px;
      height: 18px;
      margin: 10px 0 12px 0;
    }

    .beat-line .bar {
      width: 4px;
      height: 3px;
      background: linear-gradient(180deg, #ff005c, #7000ff);
      border-radius: 2px;
      transition: height 0.04s ease-out;
    }

    .track-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .track-artist {
      font-size: 0.95rem;
      color: #a7a7a7;
    }

    .lyrics-container {
      height: 220px;
      overflow-y: auto;
      margin-bottom: 24px;
      padding: 10px;
      scroll-behavior: smooth;
    }

    .lyrics-container::-webkit-scrollbar {
      width: 4px;
    }

    .lyrics-container::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .line {
      font-size: 1.1rem;
      color: #777;
      background: transparent;
      padding: 12px 0;
      transition: all 0.3s ease;
      cursor: pointer;
      font-family: Bitcount Prop Single;
    }

    .line.active {
      background: linear-gradient(135deg, #FF004D, #6A00FF);
      color: #ffffff;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      font: Bitcount Prop Single;
      font-family: Bitcount Prop Single;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .play-btn {
      background: linear-gradient(135deg, #FF004D, #6A00FF);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.04);
    }

    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #a7a7a7;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: #333;
      border-radius: 3px;
      appearance: none;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff005c;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="player-card" id="playerCard">
  <div class="header-container">
    <!-- Left Subwoofer -->
    <div class="speaker-icon">
      <svg class="speaker-svg" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="spkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF005C" />
            <stop offset="100%" stop-color="#7000FF" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="46" fill="#18191c" stroke="url(#spkGrad)" stroke-width="4"/>
        <circle cx="50" cy="50" r="38" fill="#111215" stroke="#333333" stroke-width="3"/>
        <circle cx="50" cy="50" r="26" fill="#202226" stroke="#151619" stroke-width="2"/>
        <circle cx="50" cy="50" r="12" fill="url(#spkGrad)"/>
      </svg>
    </div>

    <div class="title-group">
      <h2 class="track-title">Isa Lang</h2>
      <p class="track-artist">Arthur Felip</p>
    </div>

    <!-- Right Subwoofer -->
    <div class="speaker-icon">
      <svg class="speaker-svg" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="46" fill="#18191c" stroke="url(#spkGrad)" stroke-width="4"/>
        <circle cx="50" cy="50" r="38" fill="#111215" stroke="#333333" stroke-width="3"/>
        <circle cx="50" cy="50" r="26" fill="#202226" stroke="#151619" stroke-width="2"/>
        <circle cx="50" cy="50" r="12" fill="url(#spkGrad)"/>
      </svg>
    </div>
  </div>

  <div class="beat-line">
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
    <span class="bar"></span>
  </div>

  <div class="lyrics-container" id="lyricsContainer"></div>

  <div class="controls">
    <div class="progress-container">
      <span id="currentTime">0:00</span>
      <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
      <span id="duration">0:00</span>
    </div>

    <button class="play-btn" id="playBtn">Play</button>
  </div>

  <audio id="audio" src="Arthur-Felip isa lang.mp3" crossorigin="anonymous"></audio>
</div>

<script>
  const lyricsData = [
    { time: 0.00, text: "🎶intro🎶" },
    { time: 20.30, text: "Hmm oh (oh)" },
    { time: 24.07, text: "Hmm Pag-usapan muna natin ang iyong gabi" },
    { time: 29.44, text: "Ikaw ang pahinga ko, mahal" },
    { time: 36.41, text: "Lumiliwanag aking ngiti kapag kausap na" },
    { time: 42.80, text: "Kita pasensya lang kung" },
    { time: 46.01, text: "Babalik pa rin sa atin" },
    { time: 48.96, text: "Kahit 'di mo 'ko hanapin" },
    { time: 51.49, text: "Magpapaalipin lang sa'yo" },
    { time: 54.43, text: "Pinapawi mo ang uhaw ng aking puso" },
    { time: 58.46, text: "Oh, sabik sa lalim ng pagtingin mo para sa'kin" },
    { time: 63.39, text: "'Pag napansin mo na ako" },
    { time: 66.38, text: "Papaunawa ko agad sa'yo na" },
    { time: 69.40, text: "Isa lang, isa lang" },
    { time: 74.98, text: "Ang hinahanap ko, hanap ko" },
    { time: 81.12, text: "Ikaw ra man, ikaw ra man" },
    { time: 86.98, text: "Kung papalarin na, mapapasakin ba?" },
    { time: 93.31, text: "Kung saan-saan man magtungo 'di alam kung ba't sa puso" },
    { time: 99.10, text: "Pangalan mo lang ang tanging laman" },
    { time: 105.04, text: "Hindi alam kung ba't mas sinusunod mo pa ang iyong mga tala" },
    { time: 112.71, text: "At 'di ang nararamdaman sa akin ngunit" },
    { time: 117.42, text: "Babalik pa rin sa atin" },
    { time: 120.39, text: "Kahit 'di mo 'ko hanapin" },
    { time: 122.91, text: "Magpapaalipin lang sa'yo" },
    { time: 125.90, text: "Pinapawi mo ang uhaw ng aking puso" },
    { time: 129.86, text: "Oh, sabik sa lalim ng pagtingin mo para sa'kin" },
    { time: 135.12, text: "'Pag napansin mo na ako" },
    { time: 137.48, text: "Ipapaunawa ko agad sa'yo na" },
    { time: 140.81, text: "Isa lang, isa lang" },
    { time: 146.43, text: "Ang hinahanap ko, hanap ko" },
    { time: 152.44, text: "Ikaw ra man, ikaw ra man" },
    { time: 158.23, text: "Kung papalarin na, mapapasakin ba?" },
    { time: 199.70, text: "Kung mang-aakit, akit ka na naman" },
    { time: 205.71, text: "Pwede bang sa akin, akin lang?" },
    { time: 211.09, text: "Kung mang-aakit, akit ka na naman" },
    { time: 217.60, text: "Pwede bang sa akin, akin lang?" },
    { time: 223.48, text: "Kung mang-aakit, akit ka na naman" },
    { time: 229.57, text: "Pwede bang sa akin, akin lang?" },
    { time: 235.98, text: "Isa lang, isa lang" },
    { time: 241.66, text: "Ang hinahanap ko, hanap ko" },
    { time: 247.64, text: "Ikaw ra man, ikaw ra man" },
    { time: 253.56, text: "Kung papalarin na, mapapasakin ba?" }
  ];

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const lyricsContainer = document.getElementById('lyricsContainer');
  const progressBar = document.getElementById('progressBar');
  const currentTimeEl = document.getElementById('currentTime');
  const durationEl = document.getElementById('duration');
  const speakers = document.querySelectorAll('.speaker-icon');
  const bars = document.querySelectorAll('.beat-line .bar');

  let currentActiveIndex = -1;
  let audioCtx, analyser, source;
  let isAudioSetup = false;

  function renderLyrics() {
    lyricsContainer.innerHTML = '';
    lyricsData.forEach((item, index) => {
      const p = document.createElement('p');
      p.className = 'line';
      p.id = `line-${index}`;
      p.innerText = item.text;
      p.addEventListener('click', () => {
        audio.currentTime = item.time;
      });
      lyricsContainer.appendChild(p);
    });
  }

  function initAudioAnalyzer() {
    if (isAudioSetup) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source = audioCtx.createMediaElementSource(audio);
      source.connect(analyser);
      analyser.connect(audioCtx.destination);
      isAudioSetup = true;
    } catch (e) {
      console.log("AudioContext setup error:", e);
    }
  }

  function updateVisualizers() {
    if (!audio.paused && analyser) {
      const dataArray = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(dataArray);

      // Sub-Bass & Kick Drum (Bins 0 and 1)
      let subBass = (dataArray[0] + dataArray[1]) / 2;

      // Base Threshold: Keeps speakers relaxed during quiet/piano parts (< 165)
      const bassGateThreshold = 165;

      if (subBass > bassGateThreshold) {
        let intensity = (subBass - bassGateThreshold) / (255 - bassGateThreshold);
        let scale = 1 + Math.pow(intensity, 2) * 0.32; // Smooth, non-aggressive pop

        speakers.forEach(spk => {
          spk.style.setProperty('--spk-scale', scale);
          spk.style.transform = `scale(${scale})`;

          // Vibrates ONLY during extremely heavy/huge bass drops (> 230)
          if (subBass > 230) {
            spk.classList.add('vibrate');
            spk.style.filter = `drop-shadow(0 0 12px rgba(255, 0, 92, 0.85))`;
          } else {
            spk.classList.remove('vibrate');
            spk.style.filter = `drop-shadow(0 0 7px rgba(255, 0, 92, 0.45))`;
          }
        });
      } else {
        // Speaker sits relaxed when there is no heavy beat
        speakers.forEach(spk => {
          spk.style.transform = 'scale(1)';
          spk.classList.remove('vibrate');
          spk.style.filter = `drop-shadow(0 0 6px rgba(255, 0, 92, 0.3))`;
        });
      }

      // Middle visualizer bars
      const barIndices = [2, 6, 12, 22, 35];
      bars.forEach((bar, index) => {
        let freqValue = dataArray[barIndices[index]] || 0;
        let barHeight = Math.max(3, (freqValue / 255) * 18);
        bar.style.height = `${barHeight}px`;
      });

      requestAnimationFrame(updateVisualizers);
    } else {
      speakers.forEach(spk => {
        spk.style.transform = 'scale(1)';
        spk.classList.remove('vibrate');
      });
      bars.forEach(bar => bar.style.height = '3px');
    }
  }

  playBtn.addEventListener('click', () => {
    initAudioAnalyzer();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }

    if (audio.paused) {
      audio.play().then(() => {
        playBtn.innerText = 'Pause';
        updateVisualizers();
      }).catch(err => {
        console.log("Playback error:", err);
      });
    } else {
      audio.pause();
      playBtn.innerText = 'Play';
    }
  });

  audio.addEventListener('timeupdate', () => {
    const current = audio.currentTime;
    
    if (audio.duration) {
      progressBar.value = (current / audio.duration) * 100;
      currentTimeEl.innerText = formatTime(current);
    }

    let activeIndex = -1;
    for (let i = 0; i < lyricsData.length; i++) {
      if (current >= lyricsData[i].time) {
        activeIndex = i;
      } else {
        break;
      }
    }

    if (activeIndex !== currentActiveIndex) {
      if (currentActiveIndex !== -1) {
        const prevEl = document.getElementById(`line-${currentActiveIndex}`);
        if (prevEl) prevEl.classList.remove('active');
      }

      if (activeIndex !== -1) {
        const activeEl = document.getElementById(`line-${activeIndex}`);
        if (activeEl) {
          activeEl.classList.add('active');
          activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }
      currentActiveIndex = activeIndex;
    }
  });

  audio.addEventListener('loadedmetadata', () => {
    durationEl.innerText = formatTime(audio.duration);
  });

  audio.addEventListener('ended', () => {
    playBtn.innerText = 'Play';
  });

  progressBar.addEventListener('input', () => {
    if (audio.duration) {
      audio.currentTime = (progressBar.value / 100) * audio.duration;
    }
  });

  function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }

  renderLyrics();
</script>
</body>
</html>
