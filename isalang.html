<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isa Lang - ArthurFelip</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .player-card {
      background: #232529;
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .track-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 1rem;
      color: #a7a7a7;
      margin-bottom: 24px;
    }

    .lyrics-container {
      height: 220px;
      overflow-y: auto;
      margin-bottom: 24px;
      padding: 10px;
      scroll-behavior: smooth;
    }

    .lyrics-container::-webkit-scrollbar {
      width: 4px;
    }

    .lyrics-container::-webkit-scrollbar-thumb {
      background: #232529;
      border-radius: 4px;
    }

    .line {
      font-size: 1.1rem;
      background: #232529;
      padding: 12px 0;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .line.active {
      background: linear-gradient(135deg, #FF004D, #6A00FF);
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 15px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .play-btn {
      background: linear-gradient(135deg, #FF004D, #6A00FF);
      color: #000;
      border: none;
      border-radius: 50px;
      padding: 14px 36px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .play-btn:hover {
      background: linear-gradient(135deg, #FF004D, #6A00FF);
      transform: scale(1.04);
    }

    .progress-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      background: #232529;
      border-radius: 25px;
    }

    .progress-bar {
      flex: 1;
      height: 6px;
      background: linear-gradient(120deg, #C700FF, #0047FF);;
      border-radius: 3px;
      appearance: none;
      outline: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(90deg, #FF0000, #0000FF);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <h2 class="track-title">Isa Lang</h2>
    <p class="track-artist">Arthur Felip</p>

    <!-- Synced Lyrics Window -->
    <div class="lyrics-container" id="lyricsContainer"></div>

    <!-- Controls -->
    <div class="controls">
      <div class="progress-container">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
        <span id="duration">0:00</span>
      </div>

      <button class="play-btn" id="playBtn">Play</button>
    </div>

    <!-- Audio Element -->
    <audio id="audio" src="Arthur-Felip isa lang.mp3"></audio>
  </div>

  <script>
    // 1. Synced lyrics data array (Timestamp in seconds + text)
    const lyricsData = [
          { time: 24.07, text: "Pag-usapan muna natin ang iyong gabi" },
  { time: 29.44, text: "Ikaw ang pahinga ko, mahal" },
  { time: 36.41, text: "Lumiliwanag aking ngiti kapag kausap na" },
  { time: 42.80, text: "Kita pasensya lang kung" },
  { time: 46.01, text: "Babalik pa rin sa atin" },
  { time: 48.96, text: "Kahit 'di mo 'ko hanapin" },
  { time: 51.49, text: "Magpapaalipin lang sa'yo" },
  { time: 54.43, text: "Pinapawi mo ang uhaw ng aking puso" },
  { time: 58.46, text: "Oh, sabik sa lalim ng pagtingin mo para sa'kin" },
  { time: 63.39, text: "'Pag napansin mo na ako" },
  { time: 66.38, text: "Papaunawa ko agad sa'yo na" },
  { time: 69.40, text: "Isa lang, isa lang" },
  { time: 74.98, text: "Ang hinahanap ko, hanap ko" },
  { time: 81.12, text: "Ikaw ra man, ikaw ra man" },
  { time: 86.98, text: "Kung papalarin na, mapapasakin ba?" },
  { time: 93.31, text: "Kung saan-saan man magtungo 'di alam kung ba't sa puso" },
  { time: 99.10, text: "Pangalan mo lang ang tanging laman" },
  { time: 105.04, text: "Hindi alam kung ba't mas sinusunod mo pa ang iyong mga tala" },
  { time: 112.71, text: "At 'di ang nararamdaman sa akin ngunit" },
  { time: 117.42, text: "Babalik pa rin sa atin" },
  { time: 120.39, text: "Kahit 'di mo 'ko hanapin" },
  { time: 122.91, text: "Magpapaalipin lang sa'yo" },
  { time: 125.90, text: "Pinapawi mo ang uhaw ng aking puso" },
  { time: 129.86, text: "Oh, sabik sa lalim ng pagtingin mo para sa'kin" },
  { time: 135.12, text: "'Pag napansin mo na ako" },
  { time: 137.48, text: "Ipapaunawa ko agad sa'yo na" },
  { time: 140.81, text: "Isa lang, isa lang" },
  { time: 146.43, text: "Ang hinahanap ko, hanap ko" },
  { time: 152.44, text: "Ikaw ra man, ikaw ra man" },
  { time: 158.23, text: "Kung papalarin na, mapapasakin ba?" },
  { time: 199.70, text: "Kung mang-aakit, akit ka na naman" },
  { time: 205.71, text: "Pwede bang sa akin, akin lang?" },
  { time: 211.09, text: "Kung mang-aakit, akit ka na naman" },
  { time: 217.60, text: "Pwede bang sa akin, akin lang?" },
  { time: 223.48, text: "Kung mang-aakit, akit ka na naman" },
  { time: 229.57, text: "Pwede bang sa akin, akin lang?" },
  { time: 235.98, text: "Isa lang, isa lang" },
  { time: 241.66, text: "Ang hinahanap ko, hanap ko" },
  { time: 247.64, text: "Ikaw ra man, ikaw ra man" },
  { time: 253.56, text: "Kung papalarin na, mapapasakin ba?" }
      
      
      // You can add the remaining timestamps and lyric lines here
    ];

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const lyricsContainer = document.getElementById('lyricsContainer');
    const progressBar = document.getElementById('progressBar');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    let currentActiveIndex = -1;

    // Render lyrics inside container
    function renderLyrics() {
      lyricsContainer.innerHTML = '';
      lyricsData.forEach((item, index) => {
        const p = document.createElement('p');
        p.className = 'line';
        p.id = `line-${index}`;
        p.innerText = item.text;
        p.addEventListener('click', () => {
          audio.currentTime = item.time;
        });
        lyricsContainer.appendChild(p);
      });
    }

    // Toggle Play/Pause
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.innerText = 'Pause';
      } else {
        audio.pause();
        playBtn.innerText = 'Play';
      }
    });

    // Update synced lyrics and progress bar as music plays
    audio.addEventListener('timeupdate', () => {
      const current = audio.currentTime;
      
      // Update progress bar
      if (audio.duration) {
        progressBar.value = (current / audio.duration) * 100;
        currentTimeEl.innerText = formatTime(current);
      }

      // Sync active lyric line
      let activeIndex = -1;
      for (let i = 0; i < lyricsData.length; i++) {
        if (current >= lyricsData[i].time) {
          activeIndex = i;
        } else {
          break;
        }
      }

      if (activeIndex !== currentActiveIndex) {
        if (currentActiveIndex !== -1) {
          const prevEl = document.getElementById(`line-${currentActiveIndex}`);
          if (prevEl) prevEl.classList.remove('active');
        }

        if (activeIndex !== -1) {
          const activeEl = document.getElementById(`line-${activeIndex}`);
          if (activeEl) {
            activeEl.classList.add('active');
            activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        }
        currentActiveIndex = activeIndex;
      }
    });

    // Audio metadata loaded
    audio.addEventListener('loadedmetadata', () => {
      durationEl.innerText = formatTime(audio.duration);
    });

    // Seek via progress bar
    progressBar.addEventListener('input', () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });

    // Helper: Format seconds to MM:SS
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Initialize
    renderLyrics();
  </script>
</body>
</html>
