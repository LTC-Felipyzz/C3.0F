<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Send Message</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent: #e63946;
            --accent-hover: #ff4d5a;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            background-color: var(--bg-color);
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            /* Block layout prevents flexbox collapse when FB Lite keyboard opens */
            display: block; 
            min-height: 100%;
            /* 250px bottom padding ensures webview can scroll fields far above any keyboard */
            padding: 20px 16px 250px 16px; 
            -webkit-text-size-adjust: 100%;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px 20px;
            width: 100%;
            max-width: 480px;
            margin: 20px auto 0 auto;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .gt1 {
            font-size: 1.8rem;
            line-height: 1.3;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ff4d5a, #f72585, #4cc9f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.4;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
            display: block;
            margin-bottom: 6px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            /* Must be at least 16px (1rem) to prevent Messenger/Safari auto-zoom */
            font-size: 16px; 
            outline: none;
            transition: border-color 0.2s ease;
            -webkit-appearance: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: none;
            min-height: 110px;
        }

        button {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="gt1">Send message to anyone with website link.</h1>
            <p>Say whatever is on your mind. Your message is completely private and sent directly to me and will make a code and link for your message.</p>
        </div>

        <!-- REPLACE YOUR_EMAIL@GMAIL.COM WITH YOUR ACTUAL EMAIL ADDRESS -->
        <form action="https://formsubmit.co/estrellafelipe267@gmail.com" method="POST">
            
            <!-- FormSubmit Settings for Webviews -->
            <input type="hidden" name="_subject" value="New Anonymous Confession Received!">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <div>
                <label for="nickname">Your Social media account where I can send you the link</label>
                <input type="text" id="nickname" name="Nickname" placeholder="FB,Lite,IG etc...">
            </div>

            <div>
                <label for="confession">Write your message here include to whom</label>
                <textarea id="confession" name="Confession" placeholder="Dear crush for example HAHA" required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <script>
        // Webview keyboard fix for Messenger and FB Lite
        const formFields = document.querySelectorAll('input[type="text"], textarea');

        formFields.forEach(field => {
            field.addEventListener('focus', function () {
                // Delayed execution handles FB Lite's slow keyboard animation
                setTimeout(() => {
                    // Scroll active field to the top third of the webview window
                    const fieldRect = field.getBoundingClientRect();
                    const absoluteTop = fieldRect.top + window.pageYOffset;
                    window.scrollTo({
                        top: absoluteTop - 40,
                        behavior: 'smooth'
                    });
                }, 350);
            });
        });
    </script>
</body>
</html>
