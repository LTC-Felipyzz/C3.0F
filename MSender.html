<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Send Message to anyone in website format</title>
    <style>
        :root {
            --bg-color: #0d0f12;
            --card-bg: #161b22;
            --accent: #e63946;
            --accent-hover: #ff4d5a;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100dvh; /* Adapts dynamically to mobile browser address bars and soft keyboards */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 120px 20px; /* Extra bottom padding prevents keyboard from overlapping inputs */
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .gt1 {
            font-size: 2.2rem;
            line-height: 1.2;
            margin-bottom: 12px;
            background: linear-gradient(135deg, red, pink, yellowgreen);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 1rem; /* Stops iOS from forcefully zooming in on focus */
            outline: none;
            transition: border-color 0.2s ease;
            scroll-margin-bottom: 140px; /* Ensures space above the keyboard when focused */
            scroll-margin-top: 20px;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 130px;
        }

        button {
            background: var(--accent);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            margin-top: 8px;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="gt1">Sent message to anyone via website.</h1>
            <p>Say whatever is on your mind. Your message is completely private and sent directly to me and I make a code for you to send to them.</p>
        </div>

        <!-- REPLACE YOUR_EMAIL@GMAIL.COM WITH YOUR ACTUAL EMAIL ADDRESS -->
        <form action="https://formsubmit.co/estrellafelipe267@gmail.com" method="POST">
            
            <!-- FormSubmit Configuration -->
            <input type="hidden" name="_subject" value="New Anonymous Confession Received!">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <div>
                <label for="nickname">Nickname / Realname (Optional)</label>
                <input type="text" id="nickname" name="Nickname" placeholder="e.g., crush friend family or Anonymous">
            </div>

            <div>
                <label for="confession">Your Message</label>
                <textarea id="confession" name="Confession" placeholder="Write your confession here..." required></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </div>

    <script>
        // Smoothly auto-scroll input into view when mobile keyboard pops up
        const formInputs = document.querySelectorAll('input[type="text"], textarea');
        
        formInputs.forEach(input => {
            input.addEventListener('focus', () => {
                setTimeout(() => {
                    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300); // 300ms delay matches mobile keyboard opening animation
            });
        });
    </script>
</body>
</html>
